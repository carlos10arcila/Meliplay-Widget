    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      background:var(--app-bg);font-family:var(--sans);-webkit-font-smoothing:antialiased;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      transition:background .35s ease;
    }
    #root{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:60px 20px}
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
    @keyframes sheetUp   {from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes sheetDown {from{transform:translateY(0)}to{transform:translateY(100%)}}
    @keyframes fadeUpIn  {from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bannerIn  {0%{transform:translateY(-120%)}70%{transform:translateY(8px)}100%{transform:translateY(0)}}
    @keyframes bannerOut {from{transform:translateY(0)}to{transform:translateY(-130%)}}
    @keyframes checkDraw {to{stroke-dashoffset:0}}
    @keyframes posterFly {
      0%  {transform:translate(0,0) scale(1);opacity:1}
      60% {transform:translate(var(--fx,0px),var(--fy,-220px)) scale(.35);opacity:1}
      100%{transform:translate(var(--fx,0px),var(--fy,-220px)) scale(.35);opacity:0}
    }
    @keyframes shimmerSweep{0%{transform:translateX(-120%) skewX(-12deg)}100%{transform:translateX(220%) skewX(-12deg)}}
    @keyframes badgeIn {from{opacity:0;transform:scale(.5) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes ringPing {0%{transform:scale(.6);opacity:.6}100%{transform:scale(2);opacity:0}}
    @keyframes plusBounce{0%{transform:scale(1)}35%{transform:scale(1.45)}65%{transform:scale(.82)}100%{transform:scale(1)}}
    @keyframes pulseSearch{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}

function applyPreset(key) {
  const p = PRESETS[key];
  const r = document.documentElement.style;
  Object.entries(p).forEach(([k,v]) => { if (k.startsWith('--')) r.setProperty(k, v); });
}

// ── Icons ──────────────────────────────────────────────────────────────────
function SearchIcon({ size=17, color='#000', weight=2 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 18 18" fill="none" style={{flexShrink:0}}>
      <circle cx="7.5" cy="7.5" r="5.5" stroke={color} strokeWidth={weight}/>
      <path d="M11.8 11.8L16 16" stroke={color} strokeWidth={weight} strokeLinecap="round"/>
    </svg>
  );
}
function PlusIcon({ size=12, color='#000' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 12 12" fill="none" style={{flexShrink:0}}>
      <path d="M6 1v10M1 6h10" stroke={color} strokeWidth="2" strokeLinecap="round"/>
    </svg>
  );
}
function CameraIcon({ size=15, color='#000' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 20 16" fill="none" style={{flexShrink:0}}>
      <rect x="1" y="3" width="18" height="12" rx="2.5" stroke={color} strokeWidth="1.6"/>
      <circle cx="10" cy="9" r="3.5" stroke={color} strokeWidth="1.6"/>
      <path d="M7 3l1.5-2h3L13 3" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx="16" cy="6" r="1" fill={color}/>
    </svg>
  );
}

// ── MeliMark ───────────────────────────────────────────────────────────────
function MeliMark({ size=24, color='var(--ink)', dotColor=TERRA }) {
  const dot = Math.round(size * 0.22);
  return (
    <div style={{display:'inline-flex',alignItems:'flex-end',lineHeight:1}}>
      <span style={{fontFamily:'var(--sans)',fontSize:size,fontWeight:700,color,letterSpacing:'-0.04em',lineHeight:1}}>Meli</span>
      <span style={{fontFamily:'var(--serif)',fontSize:size,fontWeight:400,color,fontStyle:'italic',letterSpacing:'-0.02em',lineHeight:1}}>Play</span>
      <span style={{display:'inline-block',width:dot,height:dot,borderRadius:'50%',background:dotColor,marginLeft:2,marginBottom:Math.round(size*.08),flexShrink:0}}/>
    </div>
  );
}

// ── Poster ─────────────────────────────────────────────────────────────────
const POSTER_PAL = { _def:{ top:'#181818', bot:'#404040', stripe:'#888888' } };
function Poster({ movie, size=56, radius=6, withGlow=false }) {
  const pal = POSTER_PAL._def;
  const h   = Math.round(size * 1.5);
  const hasPoster = movie?.poster && movie.poster !== 'N/A';
  return (
    <div style={{
      width:size, height:h, borderRadius:radius, flexShrink:0,
      background: hasPoster ? '#111' : `linear-gradient(160deg,${pal.top} 0%,${pal.bot} 100%)`,
      position:'relative', overflow:'hidden',
      boxShadow: withGlow ? '0 0 0 2px rgba(200,82,42,.5),0 6px 20px rgba(0,0,0,.5)' : '0 2px 8px rgba(0,0,0,.35)',
    }}>
      {hasPoster ? (
        <img src={movie.poster} alt={movie.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
      ) : (
        <>
          <div style={{position:'absolute',inset:0,backgroundImage:`repeating-linear-gradient(135deg,transparent 0 8px,${pal.stripe}1A 8px 16px)`}}/>
          <div style={{position:'absolute',bottom:0,left:0,right:0,height:'45%',background:`linear-gradient(transparent,${pal.bot}EE)`}}/>
          {size >= 28 && (
            <div style={{position:'absolute',bottom:radius*.7,left:radius*.7,right:radius*.7,zIndex:2,
              fontFamily:'var(--serif)',fontSize:Math.max(5,Math.round(size*.145)),fontWeight:600,color:'#fff',
              lineHeight:1.1,textShadow:'0 1px 3px rgba(0,0,0,.7)',wordBreak:'break-word'}}>
              {movie?.title}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Widget ─────────────────────────────────────────────────────────────────
function Widget({ withBadge=false, shimmer=false, savedMovie=null, pressed=null }) {
  const { ink } = useTheme();
  return (
    <div style={{
      width:256, borderRadius:24, background:'var(--widget-bg)',
      backdropFilter:'var(--widget-blur)', WebkitBackdropFilter:'var(--widget-blur)',

    <div style={{position:'absolute',top:0,left:0,right:0,padding:'54px 14px 0',zIndex:100,pointerEvents:'none'}}>

// ── Search sheet (interactive) ─────────────────────────────────────────────
function SearchSheetInteractive({ onResultTap, onDismiss }) {
  const { ink } = useTheme();
  const [query, setQuery]                = useState('');
  const [animatingId, setAnimatingId]    = useState(null);
  const [addedIds, setAddedIds]          = useState(new Set());
  const [banners, setBanners]            = useState([]);
  const [loading, setLoading]            = useState(false);
  const [displayedResults, setDisplayed] = useState([]);
  const [closing, setClosing]            = useState(false);
  const [recents, setRecents]            = useState(['Harry Potter','Forrest Gump','Tony Stark','Steve Carell']);
  const inputRef  = useRef(null);
  const debouncer = useRef(null);

  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 420); }, []);

  const handleDismiss = () => { setClosing(true); setTimeout(() => onDismiss(), 380); };

  const handleQueryChange = val => {
    setQuery(val);
    clearTimeout(debouncer.current);
    if (!val) { setLoading(false); setDisplayed([]); return; }
    setLoading(true); setDisplayed([]);
    debouncer.current = setTimeout(async () => {
      if (val.trim().length < 2) { setDisplayed([]); setLoading(false); return; }
      try {
        const res  = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(val.trim())}&apikey=${OMDB_KEY}`);
        const data = await res.json();
        if (data.Response === 'True') {
          setDisplayed(data.Search.map(m => ({
            id:m.imdbID, title:m.Title, year:parseInt(m.Year)||0,
            type:m.Type==='series'?'series':'movie',
            genre:m.Type==='series'?'Serie':'Película', poster:m.Poster,
          })));
          const term = val.trim();
          setRecents(prev => [term, ...prev.filter(r => r.toLowerCase() !== term.toLowerCase())].slice(0, 5));
        } else { setDisplayed([]); }
      } catch(e) { setDisplayed([]); }
      setLoading(false);
    }, 700);
  };

  const removeBanner = id => setBanners(prev => prev.filter(b => b.id !== id));

  const handlePlusTap = m => {
    if (addedIds.has(m.id) || animatingId) return;
    setAnimatingId(m.id);
    setTimeout(() => { setAnimatingId(null); setAddedIds(prev => new Set(prev).add(m.id)); }, 280);
    setTimeout(() => { setBanners(prev => [...prev, {id:Date.now(), movie:m}]); onResultTap(m); }, 1100);
  };

  return (
    <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
      {banners.map(b => <ConfirmationBanner key={b.id} movie={b.movie} animate onHidden={() => removeBanner(b.id)}/>)}
      <div style={{position:'absolute',inset:0,background:'var(--device-bg)',filter:'var(--bd-filter)',transform:'scale(1.1)'}}/>
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.22)'}}/>
      <div style={{
        position:'absolute',top:62,left:0,right:0,bottom:0,
        background:'var(--sheet-bg)',backdropFilter:'var(--sheet-blur)',WebkitBackdropFilter:'var(--sheet-blur)',
        borderTopLeftRadius:24,borderTopRightRadius:24,
        animation:closing?'sheetDown .38s cubic-bezier(.32,.72,0,1) forwards':'sheetUp .42s cubic-bezier(.32,.72,0,1)',
        display:'flex',flexDirection:'column',overflow:'hidden',
        transition:'background .35s',
      }}>
        <div style={{display:'flex',justifyContent:'center',padding:'8px 0 4px'}}>
          <div style={{width:36,height:5,borderRadius:3,background:'var(--grabber)'}}/>
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 20px 14px'}}>
          <MeliMark size={15} dotColor={TERRA}/>
          <div onClick={handleDismiss} style={{fontFamily:'var(--sans)',fontSize:15,fontWeight:500,color:TERRA,cursor:'pointer'}}>Cerrar</div>
        </div>
        <div style={{padding:'0 16px'}}>
          <div style={{
            display:'flex',alignItems:'center',gap:8,
            background:'var(--search-bg)',borderRadius:12,padding:'12px 14px',
            boxShadow:'var(--search-sh)',
            animation:'pulseSearch .9s cubic-bezier(.34,1.56,.64,1) .4s 1 both',
            transition:'background .35s,box-shadow .35s',
          }}>
            <SearchIcon size={17} color="var(--ink-sub)" weight={2.2}/>
            <input ref={inputRef} value={query} onChange={e => handleQueryChange(e.target.value)}
              placeholder="Películas, series, actores…"
              style={{flex:1,border:'none',background:'transparent',outline:'none',
                fontFamily:'var(--sans)',fontSize:16,color:'var(--ink)',caretColor:TERRA}}/>
            {query && (
              <div onClick={() => { handleQueryChange(''); inputRef.current?.focus(); }}
                style={{width:18,height:18,borderRadius:'50%',flexShrink:0,
                  background:'var(--clr-btn)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
                  <path d="M1 1l6 6M7 1L1 7" stroke={ink} strokeWidth="1.6" strokeLinecap="round"/>
                </svg>
              </div>
            )}
          </div>
        </div>
        <div className="no-scrollbar" style={{flex:1,overflowY:'auto',padding:'16px 16px 0'}}>
          {!query && (
            <div style={{fontFamily:'var(--sans)',fontSize:12,fontWeight:600,
              color:'var(--ink-sub)',letterSpacing:'.08em',textTransform:'uppercase',marginBottom:12}}>Recientes</div>
          )}
          {!query && recents.map((q,i) => (
            <div key={i} onClick={() => handleQueryChange(q)}
              style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',
                borderBottom:'.5px solid var(--divider)',cursor:'pointer'}}>
              <div style={{width:30,height:30,borderRadius:8,background:'var(--ri-bg)',
                display:'flex',alignItems:'center',justifyContent:'center'}}>
                <svg width="14" height="14" viewBox="0 0 14 14">
                  <path d="M7 3v4l3 2" stroke={TERRA} strokeWidth="1.8" fill="none" strokeLinecap="round"/>
                  <circle cx="7" cy="7" r="6" stroke={TERRA} strokeWidth="1.6" fill="none"/>
                </svg>
              </div>
              <div style={{flex:1,fontFamily:'var(--sans)',fontSize:15,color:'var(--ink)'}}>{q}</div>
            </div>
          ))}
          {loading && (
            <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:4}}>
              {[0,1,2].map(i => <SkeletonRow key={i} delay={i*.06}/>)}
            </div>
          )}
          {!loading && query && (() => {
            if (!displayedResults.length)
              return <div style={{fontFamily:'var(--sans)',fontSize:14,color:'var(--ink-sub)',textAlign:'center',marginTop:40}}>Sin resultados</div>;
            const films  = displayedResults.filter(m => m.type !== 'series');
            const series = displayedResults.filter(m => m.type === 'series');
            const mixed  = films.length > 0 && series.length > 0;
            const renderRows = (items, offset=0) => items.map((m,i) => (
              <ResultRow key={m.id} movie={m} delay={(offset+i)*.05}
                added={addedIds.has(m.id)} animating={animatingId===m.id}
                onPlusTap={() => handlePlusTap(m)}/>
            ));
            return mixed ? (
              <div style={{display:'flex',flexDirection:'column'}}>
                <SectionLabel label="Películas"/>
                <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:12}}>{renderRows(films,0)}</div>
                <div style={{height:1,background:'var(--divider)',margin:'4px 8px 12px'}}/>
                <SectionLabel label="Series"/>
                <div style={{display:'flex',flexDirection:'column',gap:10}}>{renderRows(series,films.length)}</div>
              </div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:10}}>{renderRows(displayedResults)}</div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}

// ── Style panel ────────────────────────────────────────────────────────────
function StylePanel({ uiStyle, mode, onStyle, onMode }) {
  const styles = ['neuro','glass','flat'];
  const labels = { neuro:'Neumorphic', glass:'Glassmorphic', flat:'Flat' };
  return (
    <div style={{
      width:152, borderRadius:22,
      background:'var(--widget-bg)', backdropFilter:'var(--widget-blur)', WebkitBackdropFilter:'var(--widget-blur)',
      boxShadow:'var(--widget-sh)',
      padding:'18px 14px', display:'flex', flexDirection:'column', gap:18,
      transition:'background .35s,box-shadow .35s',
    }}>
      {/* Light / Dark */}
      <div>
        <div style={{fontFamily:'var(--mono)',fontSize:9,fontWeight:600,letterSpacing:'.1em',
          textTransform:'uppercase',color:'var(--ink-sub)',marginBottom:9}}>Theme</div>
        <div style={{display:'flex',background:'var(--search-bg)',borderRadius:10,padding:3,
          boxShadow:'var(--search-sh)',transition:'background .35s,box-shadow .35s'}}>
          {['light','dark'].map(m => (
            <button key={m} onClick={() => onMode(m)} style={{
              flex:1, padding:'6px 0', borderRadius:7, border:'none', cursor:'pointer',
              fontFamily:'var(--mono)', fontSize:9, fontWeight:600, letterSpacing:'.05em', textTransform:'uppercase',
              background: mode===m ? TERRA : 'transparent',
              color: mode===m ? '#fff' : 'var(--ink-sub)',
              boxShadow: mode===m ? '0 2px 8px rgba(200,82,42,.35)' : 'none',
              transition:'all .2s',
            }}>{m==='light'?'☀ Light':'☾ Dark'}</button>
          ))}
        </div>
      </div>
      {/* Style */}
      <div>
        <div style={{fontFamily:'var(--mono)',fontSize:9,fontWeight:600,letterSpacing:'.1em',
          textTransform:'uppercase',color:'var(--ink-sub)',marginBottom:9}}>Style</div>
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {styles.map(s => (
            <button key={s} onClick={() => onStyle(s)} style={{
              padding:'8px 11px', borderRadius:9, border:'none', cursor:'pointer',
              fontFamily:'var(--sans)', fontSize:13, fontWeight: uiStyle===s ? 600 : 400,
              textAlign:'left', display:'flex', alignItems:'center', gap:8,
              background: uiStyle===s ? TERRA : 'transparent',
              color: uiStyle===s ? '#fff' : 'var(--ink)',
              boxShadow: uiStyle===s ? 'var(--btn-p-sh)' : 'none',
              transition:'all .2s',
            }}>
              <span style={{width:6,height:6,borderRadius:'50%',flexShrink:0,
                background:uiStyle===s?'rgba(255,255,255,.8)':'var(--ink-sub)'}}/>
              {labels[s]}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Live demo ──────────────────────────────────────────────────────────────
function LiveDemo() {
  const [state, setState]       = useState('home');
  const [savedMovie, setSavedMovie] = useState(null);
  const [uiStyle, setUIStyle]   = useState('neuro');
  const [mode, setMode]         = useState('light');
  const timeouts = useRef([]);

  const presetKey = `${uiStyle}-${mode}`;
  const preset    = PRESETS[presetKey];

  useEffect(() => { applyPreset(presetKey); }, [presetKey]);

  const reset = () => {
    timeouts.current.forEach(clearTimeout); timeouts.current = [];
    setState('home'); setSavedMovie(null);
  };

  const handleStyle = s => setUIStyle(s);
  const handleMode  = m => setMode(m);

  const STATE_LABELS = {
    'home':'00 · home — tap Buscar','sheet':'01 · search sheet',
    'confirming':'02 · guardando…','home-updated':'03 · guardado ✓',
  };

  return (
    <ThemeCtx.Provider value={{ ink: preset._ink, isDark: preset._dark }}>
      <div style={{display:'flex',alignItems:'center',gap:36,flexWrap:'wrap',justifyContent:'center'}}>

        {/* device */}
        <div style={{position:'relative',display:'inline-block'}}>
          <IOSDevice width={370} height={800}>
            <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
              {(state==='home'||state==='home-updated') && (
                <HomeScreen
                  withBadge={state==='home-updated'} shimmer={state==='home-updated'}
                  savedMovie={savedMovie}
                  onWidgetTap={action => { if (action==='buscar') setState('sheet'); }}
                />
              )}
              {(state==='sheet'||state==='confirming') && (
                <SearchSheetInteractive
                  onResultTap={m => { setSavedMovie(m); setState('confirming'); }}
                  onDismiss={() => setState('home')}
                />
              )}
              {state==='confirming' && savedMovie && (
                <div style={{position:'absolute',top:200,left:38,zIndex:99,
                  animation:'posterFly .55s cubic-bezier(.34,1.56,.64,1) forwards',
                  '--fx':'50px','--fy':'-150px'}}>
                  <Poster movie={savedMovie} size={56} radius={6} withGlow/>
                </div>
              )}
            </div>
          </IOSDevice>

          {/* live badge */}
          <div style={{position:'absolute',top:-14,left:24,display:'flex',alignItems:'center',gap:6,
            background:'var(--banner-bg)',color:'var(--ink)',padding:'4px 10px',borderRadius:20,
            fontFamily:'var(--mono)',fontSize:10,fontWeight:600,letterSpacing:'.08em',whiteSpace:'nowrap',
            boxShadow:'var(--row-sh)',transition:'background .35s'}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:'#5DBA47',
              boxShadow:'0 0 0 0 rgba(93,186,71,.6)',animation:'ringPing 1.4s ease-out infinite'}}/>
            <span style={{color:'var(--ink)'}}>LIVE · TAP THE WIDGET</span>
          </div>

          {/* reset */}
          <button onClick={reset} style={{position:'absolute',top:-14,right:24,
            background:'var(--widget-bg)',border:`1px solid ${TERRA}`,color:TERRA,
            padding:'4px 12px',borderRadius:20,fontFamily:'var(--mono)',fontSize:10,
            fontWeight:600,letterSpacing:'.08em',cursor:'pointer',whiteSpace:'nowrap',
            transition:'background .35s'}}>↻ RESET</button>

          {/* state label */}
          <div style={{position:'absolute',bottom:-32,left:0,right:0,textAlign:'center',
            fontFamily:'var(--mono)',fontSize:10,color:'var(--ink-sub)',
            letterSpacing:'.1em',textTransform:'uppercase'}}>
            {STATE_LABELS[state]}
          </div>
        </div>

        {/* panel */}
        <StylePanel uiStyle={uiStyle} mode={mode} onStyle={handleStyle} onMode={handleMode}/>

      </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LiveDemo/>);
</script>
</body>
</html>
