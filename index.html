// Bigram similarity for fuzzy name matching
function bigramSim(a, b) {
  if (a === b) return 1;
  const bg = s => { const set = new Set(); for (let i=0; i<s.length-1; i++) set.add(s.slice(i,i+2)); return set; };
  const aB = bg(a), bB = bg(b);
  if (!aB.size || !bB.size) return 0;
  let inter = 0; aB.forEach(g => { if (bB.has(g)) inter++; });
  return (2*inter) / (aB.size + bB.size);
}

function matchActor(query) {
  const q = query.toLowerCase().trim();
  if (q.length < 3) return null;
  const qWords = q.split(/\s+/).filter(w => w.length > 1);
  let best = null, bestScore = 0;
  for (const entry of ACTOR_ENTRIES) {
    for (const name of entry.names) {
      const nWords = name.split(/\s+/).filter(w => w.length > 1);
      if (!nWords.length) continue;
      let matched = 0;
      for (const nw of nWords) {
        if (qWords.some(qw => nw===qw || nw.includes(qw) || qw.includes(nw) || bigramSim(nw,qw)>=0.72)) matched++;
      }
      const score = matched / nWords.length;
      const minMatch = Math.min(2, nWords.length);
      if (score > bestScore && score >= 0.6 && matched >= minMatch) {
        bestScore = score; best = { actor: entry.display, movies: entry.works };
      }
    }
  }
  return best;
}

function matchSemantic(query) {
  const q = query.toLowerCase();
  let best = null, bestScore = 0;
  for (const item of SEMANTIC_DB) {
    const score = item.keys.filter(k => q.includes(k)).length;
    if (score > bestScore) { bestScore = score; best = { ...item, score }; }
  }
  return bestScore >= 1 ? best : null;
}

function partialSemanticFallback(query) {
  const q = query.toLowerCase();
  const words = q.split(/\s+/).filter(w => w.length > 3);
  const matches = [];
  for (const item of SEMANTIC_DB) {
    const hit = item.keys.some(k => words.some(w => k.includes(w) || w.includes(k)));
    if (hit && !matches.find(m => m.title === item.title)) matches.push(item);
    if (matches.length >= 3) break;
  }
  return matches;
}

function formatContactsLabel(contacts) {
  const n = contacts.length;
  if (n === 0) return null;
  const names = ['Ana', 'Carlos', 'Luis', 'María', 'Jorge'];
  if (n === 1) return `${names[0]} lo vio`;
  if (n === 2) return `${names[0]} y ${names[1]} lo vieron`;
  const overflow = n - 2;
  return `${names[0]}, ${names[1]} y ${overflow} más lo vieron`;
}

function applyPreset(key) {
  const p = PRESETS[key];
  const r = document.documentElement.style;
  Object.entries(p).forEach(([k,v]) => { if (k.startsWith('--')) r.setProperty(k, v); });
}

// ── MeliMark ───────────────────────────────────────────────────────────────
function MeliMark({ size=24, color='var(--ink)', dotColor=TERRA }) {
  const dot = Math.round(size * 0.22);
  return (
    <div style={{display:'inline-flex',alignItems:'flex-end',lineHeight:1}}>
      <span style={{fontFamily:'var(--sans)',fontSize:size,fontWeight:700,color,letterSpacing:'-0.04em',lineHeight:1}}>Meli</span>
      <span style={{fontFamily:'var(--serif)',fontSize:size,fontWeight:400,color,fontStyle:'italic',letterSpacing:'-0.02em',lineHeight:1}}>Play</span>
      <span style={{display:'inline-block',width:dot,height:dot,borderRadius:'50%',background:dotColor,marginLeft:2,marginBottom:Math.round(size*.08),flexShrink:0}}/>
    </div>
  );
}

// ── Poster ─────────────────────────────────────────────────────────────────
const POSTER_PAL = { _def:{ top:'#181818', bot:'#404040', stripe:'#888888' } };
function Poster({ movie, size=56, radius=6, withGlow=false }) {
  const pal = POSTER_PAL._def;
  const h   = Math.round(size * 1.5);
  const hasPoster = movie?.poster && movie.poster !== 'N/A';
  return (
    <div style={{
      width:size, height:h, borderRadius:radius, flexShrink:0,
      background: hasPoster ? '#111' : `linear-gradient(160deg,${pal.top} 0%,${pal.bot} 100%)`,
      position:'relative', overflow:'hidden',
      boxShadow: withGlow ? '0 0 0 2px rgba(200,82,42,.5),0 6px 20px rgba(0,0,0,.5)' : '0 2px 8px rgba(0,0,0,.35)',
    }}>
      {hasPoster ? (
        <img src={movie.poster} alt={movie.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
      ) : (
        <>
          <div style={{position:'absolute',inset:0,backgroundImage:`repeating-linear-gradient(135deg,transparent 0 8px,${pal.stripe}1A 8px 16px)`}}/>
          <div style={{position:'absolute',bottom:0,left:0,right:0,height:'45%',background:`linear-gradient(transparent,${pal.bot}EE)`}}/>
          {size >= 28 && (
            <div style={{position:'absolute',bottom:radius*.7,left:radius*.7,right:radius*.7,zIndex:2,
              fontFamily:'var(--serif)',fontSize:Math.max(5,Math.round(size*.145)),fontWeight:600,color:'#fff',
              lineHeight:1.1,textShadow:'0 1px 3px rgba(0,0,0,.7)',wordBreak:'break-word'}}>
              {movie?.title}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ── Widget ─────────────────────────────────────────────────────────────────
function Widget({ withBadge=false, shimmer=false, savedMovie=null, pressed=null, onTap }) {
  const { ink } = useTheme();
  return (
    <div style={{
      width:256, borderRadius:24, background:'var(--widget-bg)',
      backdropFilter:'var(--widget-blur)', WebkitBackdropFilter:'var(--widget-blur)',
      padding:'18px 16px 16px', position:'relative', overflow:'hidden',
      boxShadow:'var(--widget-sh)',
      transition:'background .35s,box-shadow .35s',
    }}>
      {shimmer && (
        <div style={{position:'absolute',inset:0,overflow:'hidden',borderRadius:24,pointerEvents:'none',zIndex:5}}>
          <div style={{position:'absolute',top:0,bottom:0,width:'45%',
            background:'linear-gradient(90deg,transparent,rgba(200,82,42,.22) 50%,transparent)',
            animation:'shimmerSweep 1.4s ease-out 1'}}/>
        </div>
      )}
      {withBadge && savedMovie && (
        <div style={{position:'absolute',top:14,right:14,zIndex:10,animation:'badgeIn .45s cubic-bezier(.34,1.56,.64,1) both'}}>
          <Poster movie={savedMovie} size={20} radius={3}/>
        </div>
      )}
      <MeliMark size={18} dotColor={TERRA}/>
      <div style={{fontFamily:'var(--serif)',fontSize:13,fontStyle:'italic',color:'var(--ink-sub)',marginTop:3}}>Tu cine, a mano</div>
      <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:9}}>
        <button type="button" onClick={() => onTap?.('buscar')} data-action="buscar" style={{
          width:'100%',height:44,borderRadius:12,background:TERRA,border:'none',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',gap:7,
          fontFamily:'var(--sans)',fontSize:15,fontWeight:600,color:'#fff',letterSpacing:'-.01em',
          transform:pressed==='buscar'?'scale(.97)':'scale(1)',
          transition:'transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s',
          boxShadow:pressed==='buscar'?'var(--btn-p-psh)':'var(--btn-p-sh)',
        }}>
          <SearchIcon size={14} color="#fff" weight={2.5}/> Buscar
        </button>
        <button type="button" onClick={() => onTap?.('compartir')} data-action="compartir" style={{
          width:'100%',height:42,borderRadius:10,background:'var(--btn-s-bg)',border:'none',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',gap:7,
          fontFamily:'var(--sans)',fontSize:14,fontWeight:500,color:'var(--ink)',letterSpacing:'-.01em',
          transform:pressed==='compartir'?'scale(.97)':'scale(1)',
          transition:'transform .18s cubic-bezier(.34,1.56,.64,1)',
          boxShadow:'var(--btn-s-sh)',
        }}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v8M4 4l3-3 3 3" stroke="var(--ink)" strokeWidth="1.8"
              strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M2 8v4h10V8" stroke="var(--ink)" strokeWidth="1.8"
              strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          Invita a familia y amigos
        </button>
      </div>
    </div>
  );
}

// ── Swipeable row wrapper ──────────────────────────────────────────────────
function SwipeableRow({ children, onShare, onDelete, hint=false }) {
  const [swiped, setSwiped] = useState(false);
  const startX  = useRef(null);
  const rowRef  = useRef(null);
  const hinted  = useRef(false);

  useEffect(() => {
    if (!hint) return;
    if (hinted.current) return;
    hinted.current = true;
    const t1 = setTimeout(() => setSwiped(true),  600);
    const t2 = setTimeout(() => setSwiped(false), 1400);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [hint]);

  const onTouchStart = e => { startX.current = e.touches[0].clientX; };
  const onTouchEnd   = e => {
    if (startX.current === null) return;
    const dx = startX.current - e.changedTouches[0].clientX;
    if (dx > 40)  setSwiped(true);
    if (dx < -20) setSwiped(false);
    startX.current = null;
  };
  const onMouseDown = e => { startX.current = e.clientX; };
  const onMouseUp   = e => {
    if (startX.current === null) return;
    const dx = startX.current - e.clientX;
    if (dx > 40)  setSwiped(true);
    if (dx < -20) setSwiped(false);
    startX.current = null;
  };

  return (
    <div
      ref={rowRef}
      className={`swipeable-row${swiped ? ' swiped' : ''}`}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      onMouseDown={onMouseDown}   onMouseUp={onMouseUp}
    >
      <div className="swipe-content">{children}</div>
      <div className="swipe-actions">

        {/* Share action — TERRA */}
        <div
          role="button" aria-label="Compartir título"
          onClick={() => { setSwiped(false); onShare?.(); }}
          style={{
            width:74, display:'flex', flexDirection:'column',
            alignItems:'center', justifyContent:'center', gap:5,
            background:TERRA, cursor:'pointer',
          }}>
          <svg width="16" height="16" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v8M4 4l3-3 3 3" stroke="#fff" strokeWidth="1.8"
              strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M2 8v4h10V8" stroke="#fff" strokeWidth="1.8"
              strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <span style={{fontFamily:'var(--sans)',fontSize:10,fontWeight:600,
            color:'#fff',letterSpacing:'.02em'}}>Compartir</span>
        </div>

        {/* Delete action — only shown when onDelete provided */}
        {onDelete && (
          <div
            role="button" aria-label="Eliminar de mi lista"
            onClick={() => { setSwiped(false); onDelete(); }}
            style={{

                stroke="#fff" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            <span style={{fontFamily:'var(--sans)',fontSize:10,fontWeight:600,

// ── Search sheet (interactive) ─────────────────────────────────────────────
function SearchSheetInteractive({ onResultTap, onDismiss }) {
  const { ink } = useTheme();
  const [query, setQuery]                = useState('');
  const [animatingId, setAnimatingId]    = useState(null);
  const [addedIds, setAddedIds]          = useState(new Set());
  const [banners, setBanners]            = useState([]);
  const [loading, setLoading]            = useState(false);
  const [displayedResults, setDisplayed] = useState([]);
  const [closing, setClosing]            = useState(false);
  const [recents, setRecents]            = useState(['Harry Potter','Forrest Gump','Tony Stark','Steve Carell']);
  const [kbVisible, setKbVisible]        = useState(true);
  const [searchType, setSearchType]      = useState(null); // 'actor' | 'semantic' | null
  const [actorName, setActorName]        = useState(null);
  const [shareMovie, setShareMovie]      = useState(null);
  const [showShareSheet, setShowShareSheet] = useState(false);
  const [shareToast, setShareToast]      = useState(null);
  const inputRef  = useRef(null);
  const debouncer = useRef(null);

  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 200); }, []);

  const handleDismiss = () => { setClosing(true); setTimeout(() => onDismiss(), 360); };

  const handleQueryChange = val => {
    setQuery(val);
    setSearchType(null); setActorName(null);
    clearTimeout(debouncer.current);
    if (!val) { setLoading(false); setDisplayed([]); return; }
    setLoading(true); setDisplayed([]);
    debouncer.current = setTimeout(async () => {
      const q = val.trim();
      if (q.length < 2) { setDisplayed([]); setLoading(false); return; }
      try {
        const actor    = matchActor(q);
        const semantic = !actor ? matchSemantic(q) : null;
        if (actor) {
          setActorName(actor.actor); setSearchType('actor');
          const fetched = await Promise.all(
            actor.movies.slice(0,6).map(t =>
              fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(t)}&apikey=${OMDB_KEY}`)
                .then(r=>r.json())
                .then(d => d.Response==='True' ? {
                  id:d.imdbID, title:d.Title, year:parseInt(d.Year)||0,
                  type:d.Type==='series'?'series':'movie',
                  genre:d.Genre?.split(',')[0]||'Drama', poster:d.Poster,
                  plot: d.Plot && d.Plot!=='N/A' ? d.Plot.slice(0,100)+(d.Plot.length>100?'…':'') : '',
                } : null).catch(()=>null)
            )
          );
          setDisplayed(fetched.filter(Boolean));
        } else if (semantic) {
          setSearchType('semantic');
          const [smartRes, regularRes] = await Promise.all([
            fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(semantic.title)}&apikey=${OMDB_KEY}`).then(r=>r.json()),
            fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&apikey=${OMDB_KEY}`).then(r=>r.json()),
          ]);
          const out = [];
          if (smartRes.Response==='True') out.push({
            id:smartRes.imdbID, title:smartRes.Title, year:parseInt(smartRes.Year)||0,
            type:smartRes.Type==='series'?'series':'movie',
            genre:smartRes.Genre?.split(',')[0]||'Drama', poster:smartRes.Poster,
            plot: smartRes.Plot && smartRes.Plot!=='N/A' ? smartRes.Plot.slice(0,100)+(smartRes.Plot.length>100?'…':'') : '',
            smartMatch: true,
          });
          if (regularRes.Response==='True') {
            regularRes.Search.slice(0,5).forEach(m => {
              if (!out.find(x => x.id===m.imdbID)) out.push({
                id:m.imdbID, title:m.Title, year:parseInt(m.Year)||0,
                type:m.Type==='series'?'series':'movie',
                genre:m.Type==='series'?'Serie':'Película', poster:m.Poster,
              });
            });
          }
          setDisplayed(out);
        } else {
          const res  = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&apikey=${OMDB_KEY}`);
          const data = await res.json();
          if (data.Response === 'True') {
            const basic = data.Search.slice(0,6).map(m => ({
              id:m.imdbID, title:m.Title, year:parseInt(m.Year)||0,
              type:m.Type==='series'?'series':'movie',
              genre:m.Type==='series'?'Serie':'Película', poster:m.Poster,
            }));
            setDisplayed(basic);
            const term = q;
            setRecents(prev => [term, ...prev.filter(r => r.toLowerCase() !== term.toLowerCase())].slice(0, 5));
            Promise.all(basic.map(m =>
              fetch(`https://www.omdbapi.com/?i=${m.id}&apikey=${OMDB_KEY}`).then(r=>r.json()).catch(()=>null)
            )).then(details => {
              setDisplayed(prev => prev.map((m,i) => {
                const d = details[i];
                return d && d.Response==='True' ? {
                  ...m,
                  genre: d.Genre?.split(',')[0] || m.genre,
                  plot: d.Plot && d.Plot!=='N/A' ? d.Plot.slice(0,100)+(d.Plot.length>100?'…':'') : '',
                } : m;
              }));
            });
          } else { setDisplayed([]); }
        }
      } catch(e) { setDisplayed([]); }
      setLoading(false);
    }, 700);
  };

  const removeBanner = id => setBanners(prev => prev.filter(b => b.id !== id));

  const handlePlusTap = m => {
    if (addedIds.has(m.id)) return;
    setAddedIds(prev => new Set(prev).add(m.id));
    setTimeout(() => { setBanners(prev => [...prev, {id:Date.now(), movie:m}]); onResultTap(m); }, 600);
  };

  const KB_ROWS = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['⇧','Z','X','C','V','B','N','M','⌫'],
    ['123','⎵','⏎'],
  ];
  const handleKey = k => {
    if (k==='⌫') { handleQueryChange(query.slice(0,-1)); return; }
    if (k==='⎵') { handleQueryChange(query+' '); return; }
    if (k==='⏎'||k==='⇧'||k==='123'||k==='.?!') return;
    handleQueryChange(query + k.toLowerCase());
  };

  return (
    <div style={{width:'100%',height:'100%',position:'absolute',inset:0,overflow:'hidden'}}>
      {/* Blurred / dimmed scrim — backdrop-filter blurs the live home screen below */}
      <div style={{
        position:'absolute', inset:0,
        background:'rgba(0,0,0,.32)',
        backdropFilter:'blur(12px) brightness(.75)',
        WebkitBackdropFilter:'blur(12px) brightness(.75)',
      }}/>

      {/* Confirmation banners (above overlay) */}
      {banners.map(b => (
        <div key={b.id} style={{position:'absolute',top:0,left:0,right:0,zIndex:50,pointerEvents:'none'}}>
          <ConfirmationBanner movie={b.movie} animate onHidden={() => removeBanner(b.id)}/>
        </div>
      ))}

      {/* Sheet panel — slides up from bottom */}
      <div style={{
        position:'absolute', top:62, left:0, right:0, bottom:0,
        background:'var(--sheet-bg)',
        backdropFilter:'var(--sheet-blur)', WebkitBackdropFilter:'var(--sheet-blur)',
        borderTopLeftRadius:24, borderTopRightRadius:24,
        display:'flex', flexDirection:'column', overflow:'hidden',
        animation: closing ? 'sheetDown .38s cubic-bezier(.32,.72,0,1) forwards'
                           : 'sheetUp .42s cubic-bezier(.32,.72,0,1)',
        paddingBottom: kbVisible ? 0 : 34,
        transition:'padding-bottom .3s cubic-bezier(.4,0,.2,1), background .35s',
      }}>

        {/* Header — grab handle + logo left + Cerrar right */}
        <div style={{flexShrink:0}}>
          <div style={{display:'flex',justifyContent:'center',padding:'8px 0 4px'}}>
            <div style={{width:36,height:5,borderRadius:3,background:'var(--grabber)'}}/>
          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 20px 14px'}}>
            <MeliMark size={15} dotColor={TERRA}/>
            <div onClick={handleDismiss} style={{
              fontFamily:'var(--sans)',fontSize:15,fontWeight:500,
              color:TERRA,cursor:'pointer',letterSpacing:'-.01em',
            }}>Cerrar</div>
          </div>
        </div>

      {/* Recents / results — scrollable */}
      <div className="no-scrollbar" style={{flex:1,overflowY:'auto',padding:'0 16px 6px',minHeight:0}}
        onScroll={e => {
          if (e.target.scrollTop > 24) setKbVisible(false);
        }}>
        {!query && (
          <div style={{fontFamily:'var(--sans)',fontSize:12,fontWeight:600,
            color:'var(--ink-sub)',letterSpacing:'.08em',textTransform:'uppercase',
            marginBottom:10,marginTop:4}}>Recientes</div>
        )}
        {!query && recents.map((q,i) => (
          <div key={i} onClick={() => { handleQueryChange(q); setTimeout(()=>inputRef.current?.focus(),50); }}
            style={{display:'flex',alignItems:'center',gap:12,padding:'11px 0',
              borderBottom:'.5px solid var(--divider)',cursor:'pointer',
              animation:`fadeUpIn .3s cubic-bezier(.34,1.56,.64,1) ${i*.06}s both`}}>
            <div style={{width:30,height:30,borderRadius:8,background:'var(--ri-bg)',
              display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <svg width="14" height="14" viewBox="0 0 14 14">
                <path d="M7 3v4l3 2" stroke={TERRA} strokeWidth="1.8" fill="none" strokeLinecap="round"/>
                <circle cx="7" cy="7" r="6" stroke={TERRA} strokeWidth="1.6" fill="none"/>
              </svg>
            </div>
            <div style={{flex:1,fontFamily:'var(--sans)',fontSize:14,color:'var(--ink)'}}>{q}</div>
          </div>
        ))}
        {loading && (
          <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:4}}>
            {[0,1,2].map(i => <SkeletonRow key={i} delay={i*.06}/>)}
          </div>
        )}
        {!loading && query && (
          displayedResults.length === 0
            ? <EmptySearchState query={query} featured={[]} />
            : <>
                {/* Actor context banner */}
                {searchType==='actor' && actorName && (
                  <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:12,marginTop:4,
                    padding:'8px 12px',borderRadius:10,background:'rgba(212,87,46,.08)',
                    animation:'fadeUpIn .3s cubic-bezier(.34,1.56,.64,1) both'}}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                      <circle cx="8" cy="5" r="3.2" stroke={TERRA} strokeWidth="1.5"/>
                      <path d="M2 15c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke={TERRA} strokeWidth="1.5" strokeLinecap="round"/>
                    </svg>
                    <div style={{flex:1,minWidth:0}}>
                      <span style={{fontFamily:'var(--sans)',fontSize:10,fontWeight:700,
                        color:TERRA,letterSpacing:'.06em',textTransform:'uppercase'}}>Películas y series</span>
                      <div style={{fontFamily:'var(--sans)',fontSize:13,fontWeight:600,
                        color:'var(--ink)',textTransform:'capitalize',letterSpacing:'-.01em',
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{actorName}</div>
                    </div>
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                      <path d="M3 7h8M7 3l4 4-4 4" stroke={TERRA} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
                )}
                {/* Semantic smart match badge */}
                {searchType==='semantic' && displayedResults[0]?.smartMatch && (
                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10,marginTop:4,
                    animation:'fadeUpIn .3s cubic-bezier(.34,1.56,.64,1) both'}}>
                    <div style={{padding:'4px 10px',borderRadius:20,
                      background:'rgba(212,87,46,.1)',
                      display:'flex',alignItems:'center',gap:5,border:'1px solid rgba(212,87,46,.2)'}}>
                      <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                        <path d="M6 1l1.3 3.7H11L8.2 7l1 3.4L6 8.5 2.8 10.4l1-3.4L1 4.7h3.7z"
                          fill={TERRA} stroke={TERRA} strokeWidth=".5"/>
                      </svg>
                      <span style={{fontFamily:'var(--sans)',fontSize:11,fontWeight:600,
                        color:TERRA,letterSpacing:'.02em'}}>Búsqueda inteligente</span>
                    </div>
                  </div>
                )}
                {/* Result rows */}
                {searchType==='actor' ? (() => {
                  const films  = displayedResults.filter(m => m.type !== 'series');
                  const series = displayedResults.filter(m => m.type === 'series');
                  const rows = (items, offset) => items.map((m,i) => (
                    <SwipeableRow key={m.id} hint={offset+i===0} onShare={() => { setShareMovie(m); setShowShareSheet(true); }} onDelete={null}>
                      <ResultRow movie={m} delay={(offset+i)*.05}
                        added={addedIds.has(m.id)} onPlusTap={() => handlePlusTap(m)}/>
                    </SwipeableRow>
                  ));
                  return (
                    <div style={{display:'flex',flexDirection:'column'}}>
                      {films.length > 0 && <>
                        <SectionLabel label="Películas"/>
                        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:series.length?14:0}}>
                          {rows(films, 0)}
                        </div>
                      </>}
                      {series.length > 0 && <>
                        {films.length > 0 && <div style={{height:1,background:'var(--divider)',margin:'4px 8px 12px'}}/>}
                        <SectionLabel label="Series"/>
                        <div style={{display:'flex',flexDirection:'column',gap:8}}>
                          {rows(series, films.length)}
                        </div>
                      </>}
                    </div>
                  );
                })() : (() => {
                  const films  = displayedResults.filter(m => m.type !== 'series');
                  const series = displayedResults.filter(m => m.type === 'series');
                  const mixed  = films.length > 0 && series.length > 0;
                  const renderRows = (items, offset=0) => items.map((m,i) => (
                    <SwipeableRow key={m.id} hint={offset+i===0} onShare={() => { setShareMovie(m); setShowShareSheet(true); }} onDelete={null}>
                      <ResultRow movie={m} delay={(offset+i)*.05}
                        added={addedIds.has(m.id)} onPlusTap={() => handlePlusTap(m)}/>
                    </SwipeableRow>
                  ));
                  return mixed ? (
                    <div style={{display:'flex',flexDirection:'column'}}>
                      <SectionLabel label="Películas"/>
                      <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:12}}>{renderRows(films,0)}</div>
                      <div style={{height:1,background:'var(--divider)',margin:'4px 8px 12px'}}/>
                      <SectionLabel label="Series"/>
                      <div style={{display:'flex',flexDirection:'column',gap:8}}>{renderRows(series,films.length)}</div>
                    </div>
                  ) : (
                    <div style={{display:'flex',flexDirection:'column',gap:8}}>{renderRows(displayedResults)}</div>
                  );
                })()}
              </>
        )}
      </div>

      {/* ── Search bar — sits right above keyboard ── */}
      <div style={{
        padding:'8px 12px 6px', flexShrink:0,
        display:'flex', alignItems:'center', gap:10,
        borderTop:'.5px solid var(--divider)',
        background:'var(--sheet-bg)',
        transition:'background .35s',
      }}>
        <div style={{
          flex:1, display:'flex', alignItems:'center', gap:9,
          background:'var(--search-bg)',
          borderRadius:14, padding:'11px 14px',
          boxShadow:'var(--search-sh)',
          animation:'pulseSearch .7s cubic-bezier(.34,1.56,.64,1) .1s 1 both',
          transition:'background .35s, box-shadow .35s',
        }}>
          <SearchIcon size={16} color="var(--ink-sub)" weight={2}/>
          <input
            ref={inputRef}
            value={query}
            onChange={e => handleQueryChange(e.target.value)}
            onFocus={() => setKbVisible(true)}
            placeholder="Título, actor, escena o descripción…"
            style={{
              flex:1, border:'none', background:'transparent', outline:'none',
              fontFamily:'var(--sans)', fontSize:15, color:'var(--ink)',
              caretColor:TERRA, letterSpacing:'-.01em',
            }}
          />
        </div>
        {/* X — hides keyboard; search bar stays; back arrow closes entirely */}
        <div role="button" aria-label="Cerrar búsqueda" onMouseDown={e => {
          e.preventDefault();
          handleQueryChange('');
          setKbVisible(false);
          setTimeout(() => inputRef.current?.blur(), 0);
        }}
          style={{
            width:36, height:36, borderRadius:'50%', flexShrink:0, cursor:'pointer',
            background:'var(--clr-btn)',
            display:'flex', alignItems:'center', justifyContent:'center',
            transition:'background .35s',
          }}>
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="var(--ink)" strokeWidth="2.2" strokeLinecap="round"/>
          </svg>
        </div>
      </div>

      {/* ── Virtual keyboard — slides in/out ── */}
      <div style={{
        flexShrink:0, overflow:'hidden',
        maxHeight: kbVisible ? 260 : 0,
        transition:'max-height .32s cubic-bezier(.4,0,.2,1)',
      }}>
        <div style={{
          background:'var(--kb-bg, rgba(210,213,219,1))',
          padding:'8px 3px 6px',
          borderTop:'.5px solid var(--divider)',
          transition:'background .35s',
        }}>
          {KB_ROWS.map((row, ri) => (
            <div key={ri} style={{display:'flex',justifyContent:'center',gap:5,marginBottom:ri===3?0:7}}>
              {row.map(k => {
                const isAction = ['⇧','⌫','123','.?!','⏎'].includes(k);
                const isSpace  = k==='⎵';
                const isDel    = k==='⌫';
                const isReturn = k==='⏎';
                const isShift  = k==='⇧';
                return (
                  <button key={k} onMouseDown={e => { e.preventDefault(); handleKey(k); inputRef.current?.focus(); }}
                    style={{
                      flexShrink: isSpace ? 1 : 0,
                      width:  isSpace ? undefined : isReturn ? 88 : (ri===2&&(isShift||isDel)) ? 42 : ri===3 ? 76 : 30,
                      flex:   isSpace ? 1 : undefined,
                      maxWidth: isSpace ? 168 : undefined,
                      height: ri===3 ? 44 : 42,
                      borderRadius:5, border:'none', cursor:'pointer',
                      fontFamily:'var(--sans)',
                      fontSize: isDel ? 0 : isReturn||isAction ? 13 : 17,
                      fontWeight: isAction ? 500 : 400,
                      color:'var(--ink)',
                      background: isAction&&!isReturn ? 'var(--kb-action,rgba(172,177,185,1))'
                                : isReturn ? TERRA : 'var(--key-bg,#fff)',
                      boxShadow: isAction ? 'none' : '0 1px 0 rgba(0,0,0,.28)',
                      display:'flex', alignItems:'center', justifyContent:'center',
                      letterSpacing: isReturn ? '.02em' : 0,
                      userSelect:'none', WebkitUserSelect:'none',
                    }}>
                    {isDel ? (
                      <svg width="17" height="13" viewBox="0 0 17 13" fill="none">
                        <path d="M5 1.5L1 6.5L5 11.5H16V1.5H5Z" stroke="var(--ink)" strokeWidth="1.4" fill="none"/>
                        <path d="M7.5 4.5l4 4M11.5 4.5l-4 4" stroke="var(--ink)" strokeWidth="1.4" strokeLinecap="round"/>
                      </svg>
                    ) : isReturn ? '↵' : k==='⎵' ? '' : k}
                  </button>
                );
              })}
            </div>
          ))}
        </div>
      </div>

      {/* Share sheet */}
      {showShareSheet && (
        <IOSShareSheet
          movie={shareMovie}
          onDismiss={msg => {
            setShowShareSheet(false);
            setShareMovie(null);
            if (msg) {
              setShareToast(msg);
              setTimeout(() => setShareToast(null), 3000);
            }
          }}
        />
      )}

      {/* Share toast */}
      {shareToast && (
        <div style={{position:'absolute',top:16,left:16,right:16,zIndex:310,
          animation:'slideUpFade .38s cubic-bezier(.34,1.56,.64,1) both',pointerEvents:'none'}}>
          <div style={{background:'rgba(22,18,14,.93)',borderRadius:16,padding:'12px 16px',
            display:'flex',alignItems:'center',gap:10,
            boxShadow:'0 8px 32px rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.1)',
            backdropFilter:'blur(16px)',WebkitBackdropFilter:'blur(16px)'}}>
            <div style={{width:28,height:28,borderRadius:8,background:TERRA,flexShrink:0,
              display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2 6l3 3 5-5" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <span style={{fontFamily:'var(--sans)',fontSize:12,color:'#F5F0E8',lineHeight:1.4}}>{shareToast}</span>
          </div>
        </div>
      )}

      </div>
    </div>
  );
}

// ── MeliPlay in-app search view ───────────────────────────────────────────
function MeliPlaySearchView({ onMovieAdded, onKbChange }) {
  const { ink } = useTheme();
  const [query, setQuery]           = useState('');
  const [loading, setLoading]       = useState(false);
  const [results, setResults]       = useState([]);
  const [recents, setRecents]       = useState(['Harry Potter','Noches de fuego','Avengers','La La Land']);
  const [addedIds, setAddedIds]     = useState(new Set());
  const [animatingId, setAnimId]    = useState(null);
  const [banners, setBanners]       = useState([]);
  const [searchType, setSearchType] = useState(null); // 'actor' | 'semantic' | null
  const [actorName, setActorName]   = useState(null);
  const [kbVisible, setKbVisible]   = useState(true);
  const [shareMovie, setShareMovie]    = useState(null);
  const [showShareSheet, setShowShareSheet] = useState(false);
  const [shareToast, setShareToast]    = useState(null);
  const debouncer = useRef(null);
  const inputRef  = useRef(null);

  // Helper — updates local state AND notifies parent so tab bar can hide
  const setKbVis = v => { setKbVisible(v); onKbChange?.(v); };

  useEffect(() => {
    setTimeout(() => inputRef.current?.focus(), 150);
    onKbChange?.(true);                    // keyboard starts visible
    return () => { onKbChange?.(false); }; // restore tab bar when leaving buscar
  }, []);

  const handleQueryChange = val => {
    setQuery(val);
    setSearchType(null); setActorName(null);
    clearTimeout(debouncer.current);
    if (!val) { setLoading(false); setResults([]); return; }
    setLoading(true); setResults([]);
    debouncer.current = setTimeout(async () => {
      const q = val.trim();
      if (q.length < 2) { setResults([]); setLoading(false); return; }
      try {
        const actor    = matchActor(q);
        const semantic = !actor ? matchSemantic(q) : null;

        if (actor) {
          // ── Actor search: fetch each of their movies by exact title ──
          setActorName(actor.actor); setSearchType('actor');
          const fetched = await Promise.all(
            actor.movies.slice(0,10).map(t =>
              fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(t)}&apikey=${OMDB_KEY}`)
                .then(r => r.json())
                .then(d => d.Response==='True' ? {
                  id:d.imdbID, title:d.Title, year:parseInt(d.Year)||0,
                  type:d.Type==='series'?'series':'movie',
                  genre:d.Genre?.split(',')[0]||'Drama', poster:d.Poster,
                  plot: d.Plot && d.Plot!=='N/A' ? d.Plot.slice(0,100)+(d.Plot.length>100?'…':'') : '',
                } : null).catch(()=>null)
            )
          );
          setResults(fetched.filter(Boolean));

        } else if (semantic) {
          // ── Semantic search: top match + regular title search ──
          setSearchType('semantic');
          const [smartRes, regularRes] = await Promise.all([
            fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(semantic.title)}&apikey=${OMDB_KEY}`).then(r=>r.json()),
            fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&apikey=${OMDB_KEY}`).then(r=>r.json()),
          ]);
          const out = [];
          if (smartRes.Response==='True') out.push({
            id:smartRes.imdbID, title:smartRes.Title, year:parseInt(smartRes.Year)||0,
            type:'movie', genre:smartRes.Genre?.split(',')[0]||'Drama', poster:smartRes.Poster,
            plot: smartRes.Plot && smartRes.Plot!=='N/A' ? smartRes.Plot.slice(0,100)+(smartRes.Plot.length>100?'…':'') : '',
            smartMatch:true,
          });
          if (regularRes.Response==='True') {
            regularRes.Search.forEach(m => {
              if (!out.some(r=>r.id===m.imdbID)) out.push({
                id:m.imdbID, title:m.Title, year:parseInt(m.Year)||0,
                type:m.Type==='series'?'series':'movie',
                genre:m.Type==='series'?'Serie':'Película', poster:m.Poster,
              });
            });
          }
          setResults(out);
          // Enrich ?s= fallback results (those without plot) in background
          const toEnrich = out.filter(m => !m.plot);
          if (toEnrich.length) {
            Promise.all(toEnrich.map(m =>
              fetch(`https://www.omdbapi.com/?i=${m.id}&apikey=${OMDB_KEY}`).then(r=>r.json()).catch(()=>null)
            )).then(details => {
              setResults(prev => prev.map(m => {
                const d = details[toEnrich.findIndex(t=>t.id===m.id)];
                return d && d.Response==='True' ? {
                  ...m,
                  genre: d.Genre?.split(',')[0] || m.genre,
                  plot: d.Plot && d.Plot!=='N/A' ? d.Plot.slice(0,100)+(d.Plot.length>100?'…':'') : '',
                } : m;
              }));
            });
          }

        } else {
          // ── Regular OMDb title/keyword search ──
          const res  = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&apikey=${OMDB_KEY}`);
          const data = await res.json();
          if (data.Response==='True') {
            const basic = data.Search.slice(0,6).map(m => ({
              id:m.imdbID, title:m.Title, year:parseInt(m.Year)||0,
              type:m.Type==='series'?'series':'movie',
              genre:m.Type==='series'?'Serie':'Película', poster:m.Poster,
            }));
            setResults(basic);
            // Enrich with plot in background
            Promise.all(basic.map(m =>
              fetch(`https://www.omdbapi.com/?i=${m.id}&apikey=${OMDB_KEY}`).then(r=>r.json()).catch(()=>null)
            )).then(details => {
              setResults(prev => prev.map((m,i) => {
                const d = details[i];
                return d && d.Response==='True' ? {
                  ...m,
                  genre: d.Genre?.split(',')[0] || m.genre,
                  plot: d.Plot && d.Plot!=='N/A' ? d.Plot.slice(0,100)+(d.Plot.length>100?'…':'') : '',
                } : m;
              }));
            });
          } else { setResults([]); }
        }
        const term = q;
        setRecents(prev => [term, ...prev.filter(r=>r.toLowerCase()!==term.toLowerCase())].slice(0,5));
      } catch(e) { setResults([]); }
      setLoading(false);
    }, 600);
  };

  const handlePlusTap = m => {
    if (addedIds.has(m.id)) return;
    setAddedIds(prev => new Set(prev).add(m.id));
    setTimeout(() => {
      setBanners(prev => [...prev, {id:Date.now(), movie:m}]);
      onMovieAdded?.(m);
    }, 600);
  };

  const removeBanner = id => setBanners(prev => prev.filter(b => b.id !== id));

  const handleKey = k => {
    if (k==='⌫') { handleQueryChange(query.slice(0,-1)); return; }
    if (k==='⎵') { handleQueryChange(query+' '); return; }
    if (k==='⏎' || k==='⇧' || k==='123' || k==='.?!') return;
    handleQueryChange(query + k.toLowerCase());
  };

  const KB_ROWS = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['⇧','Z','X','C','V','B','N','M','⌫'],
    ['123','⎵','⏎'],
  ];

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,overflow:'hidden',position:'relative',minHeight:0,
      paddingBottom: kbVisible ? 0 : 76,
      transition:'padding-bottom .3s cubic-bezier(.4,0,.2,1)',
    }}>
      {/* Confirmation banners */}
      {banners.map(b => (
        <div key={b.id} style={{position:'absolute',top:0,left:0,right:0,zIndex:50,pointerEvents:'none'}}>
          <ConfirmationBanner movie={b.movie} animate onHidden={() => removeBanner(b.id)}/>
        </div>
      ))}

      {/* Recents / results scroll area */}
      <div className="no-scrollbar" style={{flex:1,overflowY:'auto',padding:'0 16px 6px',minHeight:0}}
        onScroll={e => {
          if (e.target.scrollTop > 24) setKbVis(false);
        }}>
        {!query && (
          <>
            <div style={{fontFamily:'var(--sans)',fontSize:12,fontWeight:600,
              color:'var(--ink-sub)',letterSpacing:'.08em',textTransform:'uppercase',
              marginBottom:10,marginTop:4}}>Recientes</div>
            {recents.map((q,i) => (
              <div key={i} onClick={() => { handleQueryChange(q); setTimeout(() => inputRef.current?.focus(), 50); }}
                style={{display:'flex',alignItems:'center',gap:12,padding:'11px 0',
                  borderBottom:'.5px solid var(--divider)',cursor:'pointer',
                  animation:`fadeUpIn .3s cubic-bezier(.34,1.56,.64,1) ${i*.06}s both`}}>
                <div style={{width:30,height:30,borderRadius:8,background:'var(--ri-bg)',
                  display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <svg width="14" height="14" viewBox="0 0 14 14">
                    <path d="M7 3v4l3 2" stroke={TERRA} strokeWidth="1.8" fill="none" strokeLinecap="round"/>
                    <circle cx="7" cy="7" r="6" stroke={TERRA} strokeWidth="1.6" fill="none"/>
                  </svg>
                </div>
                <div style={{flex:1,fontFamily:'var(--sans)',fontSize:14,color:'var(--ink)'}}>{q}</div>
              </div>
            ))}
          </>
        )}
        {loading && (
          <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:4}}>
            {[0,1,2].map(i => <SkeletonRow key={i} delay={i*.06}/>)}
          </div>
        )}
        {!loading && query && (
          results.length === 0
            ? <EmptySearchState query={query} featured={[]} />
            : <>
                {/* Actor context banner */}
                {searchType==='actor' && actorName && (
                  <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:12,marginTop:4,
                    padding:'8px 12px',borderRadius:10,background:'rgba(200,82,42,.08)',
                    animation:'fadeUpIn .3s cubic-bezier(.34,1.56,.64,1) both'}}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                      <circle cx="8" cy="5" r="3.2" stroke={TERRA} strokeWidth="1.5"/>
                      <path d="M2 15c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke={TERRA} strokeWidth="1.5" strokeLinecap="round"/>
                    </svg>
                    <div style={{flex:1,minWidth:0}}>
                      <span style={{fontFamily:'var(--sans)',fontSize:10,fontWeight:700,
                        color:TERRA,letterSpacing:'.06em',textTransform:'uppercase'}}>Películas y series</span>
                      <div style={{fontFamily:'var(--sans)',fontSize:13,fontWeight:600,
                        color:'var(--ink)',textTransform:'capitalize',letterSpacing:'-.01em',
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{actorName}</div>
                    </div>
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                      <path d="M3 7h8M7 3l4 4-4 4" stroke={TERRA} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
                )}

                {/* Semantic "smart match" badge for the first result */}
                {searchType==='semantic' && results[0]?.smartMatch && (
                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10,marginTop:4,
                    animation:'fadeUpIn .3s cubic-bezier(.34,1.56,.64,1) both'}}>
                    <div style={{padding:'4px 10px',borderRadius:20,
                      background:'rgba(200,82,42,.1)',
                      display:'flex',alignItems:'center',gap:5,border:'1px solid rgba(200,82,42,.2)'}}>
                      <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                        <path d="M6 1l1.3 3.7H11L8.2 7l1 3.4L6 8.5 2.8 10.4l1-3.4L1 4.7h3.7z"
                          fill={TERRA} stroke={TERRA} strokeWidth=".5"/>
                      </svg>
                      <span style={{fontFamily:'var(--sans)',fontSize:11,fontWeight:600,
                        color:TERRA,letterSpacing:'.02em'}}>Búsqueda inteligente</span>
                    </div>
                  </div>
                )}

                {/* Actor results: movies first, then series separated */}
                {searchType==='actor' ? (() => {
                  const films  = results.filter(m => m.type !== 'series');
                  const series = results.filter(m => m.type === 'series');
                  const rows = (items, offset) => items.map((m,i) => (
                    <SwipeableRow key={m.id} hint={offset+i===0} onShare={() => { setShareMovie(m); setShowShareSheet(true); }} onDelete={null}>
                      <ResultRow movie={m} delay={(offset+i)*.04}
                        added={addedIds.has(m.id)}
                        onPlusTap={() => handlePlusTap(m)}/>
                    </SwipeableRow>
                  ));
                  return (
                    <div style={{display:'flex',flexDirection:'column'}}>
                      {films.length > 0 && <>
                        <SectionLabel label="Películas"/>
                        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:series.length?14:0}}>
                          {rows(films, 0)}
                        </div>
                      </>}
                      {series.length > 0 && <>
                        {films.length > 0 && <div style={{height:1,background:'var(--divider)',margin:'4px 8px 12px'}}/>}
                        <SectionLabel label="Series"/>
                        <div style={{display:'flex',flexDirection:'column',gap:8}}>
                          {rows(series, films.length)}
                        </div>
                      </>}
                    </div>
                  );
                })() : (
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {results.map((m,i) => (
                      <SwipeableRow key={m.id} hint={i===0} onShare={() => { setShareMovie(m); setShowShareSheet(true); }} onDelete={null}>
                        <ResultRow movie={m} delay={i*.04}
                          added={addedIds.has(m.id)}
                          onPlusTap={() => handlePlusTap(m)}/>
                      </SwipeableRow>
                    ))}
                  </div>
                )}
              </>
        )}
      </div>

      {/* ── Search input — above keyboard, theme-aware ── */}
      <div style={{
        padding:'8px 12px 6px', flexShrink:0,
        display:'flex', alignItems:'center', gap:10,
        borderTop:'.5px solid var(--divider)',
        background:'var(--device-bg)',
        transition:'background .35s',
      }}>
        <div style={{
          flex:1, display:'flex', alignItems:'center', gap:9,
          background:'var(--search-bg)',
          borderRadius:14, padding:'11px 14px',
          boxShadow:'var(--search-sh)',
          animation:'pulseSearch .7s cubic-bezier(.34,1.56,.64,1) .1s 1 both',
          transition:'background .35s, box-shadow .35s',
        }}>
          <SearchIcon size={16} color="var(--ink-sub)" weight={2}/>
          <input
            ref={inputRef}
            value={query}
            onChange={e => handleQueryChange(e.target.value)}
            onFocus={() => setKbVis(true)}
            placeholder="Título, actor, escena o descripción…"
            style={{
              flex:1, border:'none', background:'transparent', outline:'none',
              fontFamily:'var(--sans)', fontSize:15, color:'var(--ink)',
              caretColor:TERRA, letterSpacing:'-.01em',
            }}
          />
        </div>
        {/* X — hides keyboard and brings menu back */}
        <div role="button" aria-label="Cerrar búsqueda" onMouseDown={e => {
          e.preventDefault();
          handleQueryChange('');
          setKbVis(false);
          setTimeout(() => inputRef.current?.blur(), 0);
        }}
          style={{
            width:36, height:36, borderRadius:'50%', flexShrink:0, cursor:'pointer',
            background:'var(--clr-btn)',
            display:'flex', alignItems:'center', justifyContent:'center',
            transition:'background .35s',
          }}>
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="var(--ink)" strokeWidth="2.2" strokeLinecap="round"/>
          </svg>
        </div>
      </div>

      {/* Visual iOS keyboard — slides away on scroll, back on input focus */}
      <div style={{
        flexShrink:0, overflow:'hidden',
        maxHeight: kbVisible ? 260 : 0,
        transition:'max-height .32s cubic-bezier(.4,0,.2,1)',
      }}>
      <div style={{
        background:'var(--kb-bg, rgba(210,213,219,1))',
        padding:'8px 3px 6px',
        borderTop:'.5px solid var(--divider)',
        transition:'background .35s',
      }}>
        {KB_ROWS.map((row, ri) => (
          <div key={ri} style={{display:'flex',justifyContent:'center',
            gap: ri===3 ? 5 : 5, marginBottom: ri===3 ? 0 : 7}}>
            {row.map(k => {
              const isAction = ['⇧','⌫','123','.?!','⏎'].includes(k);
              const isSpace  = k==='⎵';
              const isDel    = k==='⌫';
              const isReturn = k==='⏎';
              const isShift  = k==='⇧';
              return (
                <button key={k} onMouseDown={e => { e.preventDefault(); handleKey(k); inputRef.current?.focus(); }}
                  style={{
                    flexShrink: isSpace ? 1 : 0,
                    width:  isSpace ? undefined
                          : isReturn ? 88
                          : (ri===2 && (isShift || isDel)) ? 42
                          : ri===3 ? 76
                          : 30,
                    flex:   isSpace ? 1 : undefined,
                    maxWidth: isSpace ? 168 : undefined,
                    height: ri===3 ? 44 : 42,
                    borderRadius: 5,
                    border:'none',
                    cursor:'pointer',
                    fontFamily:'var(--sans)',
                    fontSize: isDel ? 0 : isReturn || isAction ? 13 : 17,
                    fontWeight: isAction ? 500 : 400,
                    color:'var(--ink)',
                    background: isAction && !isReturn
                      ? 'var(--kb-action, rgba(172,177,185,1))'
                      : isReturn
                        ? TERRA
                        : 'var(--key-bg, #fff)',
                    boxShadow: isAction
                      ? 'none'
                      : '0 1px 0 rgba(0,0,0,.28)',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    letterSpacing: isReturn ? '.02em' : 0,
                    userSelect:'none',
                    WebkitUserSelect:'none',
                    transition:'background .1s',
                  }}>
                  {isDel ? (
                    <svg width="17" height="13" viewBox="0 0 18 14" fill="none">
                      <path d="M6.5 1H16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H6.5L1.5 7z" stroke="var(--ink)" strokeWidth="1.4" fill="none"/>
                      <path d="M8.5 5l4 4m0-4l-4 4" stroke="var(--ink)" strokeWidth="1.4" strokeLinecap="round"/>
                    </svg>
                  ) : isReturn ? (
                    <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
                      <path d="M16 2v4a2 2 0 0 1-2 2H4m0 0l4-4m-4 4 4 4" stroke="#fff" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  ) : isSpace ? 'espacio' : k}
                </button>
              );
            })}
          </div>
        ))}
      </div>

      {/* Share sheet */}
      {showShareSheet && (
        <IOSShareSheet
          movie={shareMovie}
          onDismiss={msg => {
            setShowShareSheet(false);
            setShareMovie(null);
            if (msg) {
              setShareToast(msg);
              setTimeout(() => setShareToast(null), 3000);
            }
          }}
        />
      )}

      {/* Share toast */}
      {shareToast && (
        <div style={{position:'absolute',top:16,left:16,right:16,zIndex:310,
          animation:'slideUpFade .38s cubic-bezier(.34,1.56,.64,1) both',pointerEvents:'none'}}>
          <div style={{background:'rgba(22,18,14,.93)',borderRadius:16,padding:'12px 16px',
            display:'flex',alignItems:'center',gap:10,
            boxShadow:'0 8px 32px rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.1)',
            backdropFilter:'blur(16px)',WebkitBackdropFilter:'blur(16px)'}}>
            <div style={{width:28,height:28,borderRadius:8,background:TERRA,flexShrink:0,
              display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2 6l3 3 5-5" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </div>
            <span style={{fontFamily:'var(--sans)',fontSize:12,color:'#F5F0E8',lineHeight:1.4}}>{shareToast}</span>
          </div>
        </div>
      )}

      </div>
    </div>
  );
}

// ── Friend profile screen ────────────────────────────────────────────────────
function FriendProfileScreen({ friend, movies, onBack, forceClose=false }) {
  const { ink } = useTheme();
  const [tab, setTab]         = useState('peliculas');
  const [closing, setClosing] = useState(false);
  const [added, setAdded]     = useState(false);
  const [addedItems, setAddedItems] = useState({});
  const [toastMovie, setToastMovie] = useState(null);

  useEffect(() => {
    if (forceClose) setClosing(true);
  }, [forceClose]);

  const handleAddItem = (m) => {
    if (addedItems[m.id]) return;
    setAddedItems(prev => ({...prev, [m.id]: true}));
    setToastMovie(m);
    setTimeout(() => setToastMovie(null), 2800);
  };

  const handleBack = () => { setClosing(true); setTimeout(onBack, 360); };

  const lastWatched = movies[friend.mi] || movies[0];

  // Mock watched lists: movies = even indices, series = odd indices
  const peliculas = movies.filter((_, i) => i % 2 === 0);
  const series    = movies.filter((_, i) => i % 2 !== 0);
  const list      = tab === 'peliculas' ? peliculas : series;

  return (
    <div style={{
      position:'absolute', inset:0, zIndex:20,
      background:'var(--device-bg)',
      display:'flex', flexDirection:'column', overflow:'hidden',
      transition:'background .35s',
      animation: closing ? 'pushOut .42s cubic-bezier(0.25,1,0.5,1) forwards'
                         : 'pushIn .42s cubic-bezier(0.25,1,0.5,1)',
    }}>
      {/* status bar spacer */}
      <div style={{height:62, flexShrink:0}}/>

      {/* Header */}
      <div style={{flexShrink:0, display:'flex', alignItems:'center',
        padding:'2px 20px 12px'}}>
        <button onClick={handleBack} aria-label="Volver" style={{background:'none',border:'none',cursor:'pointer',
          width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center',
          borderRadius:8,padding:0,flexShrink:0}}>
          <svg width="10" height="17" viewBox="0 0 10 17" fill="none">
            <path d="M8.5 1.5L2 8.5L8.5 15.5" stroke={ink} strokeWidth="2.2"
              strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
        <span style={{flex:1,textAlign:'center',fontFamily:'var(--sans)',fontSize:17,
          fontWeight:700,color:'var(--ink)',letterSpacing:'-.02em'}}>{friend.name}</span>
        <div style={{width:32, flexShrink:0}}/>
      </div>

      {/* Scrollable body */}
      <div className="no-scrollbar" style={{flex:1,overflowY:'auto',paddingBottom:28}}>

        {/* Hero banner — last watched */}
        {lastWatched && (
          <div style={{margin:'0 20px',borderRadius:18,overflow:'hidden',
            position:'relative',height:192,
            boxShadow:'var(--row-sh)',transition:'box-shadow .35s'}}>
            {lastWatched.poster && lastWatched.poster !== 'N/A' ? (
              <img src={lastWatched.poster}
                style={{width:'100%',height:'100%',objectFit:'cover',objectPosition:'top'}}/>
            ) : (
              <div style={{width:'100%',height:'100%',background:'linear-gradient(135deg,#1a1008,#3c2010)'}}/>
            )}
            <div style={{position:'absolute',inset:0,
              background:'linear-gradient(to bottom,rgba(0,0,0,.04) 25%,rgba(0,0,0,.84))'}}/>

            {/* VIENDO pill — shown when friend is actively watching */}
            {friend.status === 'viendo' && (
              <div style={{
                position:'absolute', top:12, left:12,
                display:'flex', alignItems:'center', gap:4,
                padding:'3px 8px', borderRadius:10,
                background:'#16A34A',
                backdropFilter:'blur(4px)',
              }}>
                <span style={{width:6,height:6,borderRadius:'50%',background:'#fff',
                  display:'inline-block',flexShrink:0,
                  boxShadow:'0 0 0 0 rgba(255,255,255,.6)',
                  animation:'ringPing 1.4s ease-out infinite'}}/>
                <span style={{fontFamily:'var(--mono)',fontSize:9,fontWeight:700,
                  color:'#fff',letterSpacing:'.04em'}}>VIENDO</span>
              </div>
            )}

            <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'12px 14px 16px'}}>
              <div style={{fontFamily:'var(--sans)',fontSize:15,fontWeight:700,color:'#fff',
                letterSpacing:'-.02em',marginBottom:10,lineHeight:1.2}}>
                {lastWatched.title}
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                {/* + add button */}
                <button onClick={() => {
                  if (!added) {
                    setAdded(true);
                    setToastMovie(lastWatched);
                    setTimeout(() => setToastMovie(null), 2800);
                  }
                }} style={{
                  width:44,height:44,borderRadius:'50%',flexShrink:0,cursor:'pointer',
                  border:'1.5px solid rgba(255,255,255,.55)',
                  background: added ? TERRA : 'rgba(255,255,255,.15)',
                  backdropFilter:'blur(8px)',
                  display:'flex',alignItems:'center',justifyContent:'center',
                  transition:'background .2s',
                }}>
                  {added ? (
                    <svg width="12" height="9" viewBox="0 0 12 9" fill="none">
                      <path d="M1 4.5L4.5 8L11 1" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  ) : (
                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                      <path d="M6.5 1.5v10M1.5 6.5h10" stroke="#fff" strokeWidth="2" strokeLinecap="round"/>
                    </svg>
                  )}
                </button>
                {/* Ver ahora */}
                <button style={{
                  height:34,paddingLeft:18,paddingRight:18,borderRadius:17,
                  background:TERRA,border:'none',cursor:'pointer',
                  fontFamily:'var(--sans)',fontSize:13,fontWeight:600,color:'#fff',
                  letterSpacing:'-.01em',
                  boxShadow:'0 3px 10px rgba(200,82,42,.4)',
                }}>Ver ahora</button>
              </div>
            </div>
          </div>
        )}

        {/* Tabs */}
        <div style={{display:'flex',borderBottom:'1.5px solid var(--divider)',margin:'20px 20px 0'}}>
          {[['peliculas','Películas'],['series','Series']].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)} style={{
              background:'none',border:'none',cursor:'pointer',
              padding:'8px 0',marginRight:24,
              fontFamily:'var(--sans)',fontSize:13,
              fontWeight: tab===id ? 700 : 400,
              color: tab===id ? TERRA : 'var(--ink-sub)',
              borderBottom: tab===id ? `2px solid ${TERRA}` : '2px solid transparent',
              marginBottom:'-1.5px',transition:'color .2s',
            }}>{label}</button>
          ))}
        </div>

        {/* Content list */}

    let cancelled = false;

    Promise.all(IDS.map(id =>
      fetch(`https://www.omdbapi.com/?i=${id}&apikey=${OMDB_KEY}`)
        .then(r => r.json())
        .then(d => d.Response === 'True' ? {
          id:d.imdbID, title:d.Title, year:parseInt(d.Year)||0,
          genre:d.Genre?.split(',')[0]||'Drama',

            letterSpacing:'.1em',textTransform:'uppercase'}}>
            {STATE_LABELS[state]}
          </div>
        </div>

        {/* panel */}
        <StylePanel uiStyle={uiStyle} mode={mode} onStyle={handleStyle} onMode={handleMode}/>

      </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LiveDemo/>);
</script>
</body>
</html>
